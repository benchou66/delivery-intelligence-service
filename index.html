<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery Intelligence Service — 企業 AI 落地服務規格</title>
<meta name="description" content="整合 AI LLM Wiki 知識答詢、DevOps CI/CD Agentic 流水線、FDE AI 落地師的端對端企業 AI 落地服務體系。" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- ▼ 所有文字內容都在 content.js，要改字請改那個檔，不用動這個檔 ▼ -->
<script src="content.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;
const D = window.CONTENT;   // ← 內容資料（來自 content.js）

// ─── Color tokens（設計用色票；一般不需更動）─────────────────────────────
const C = {
  navy: "#0A1628", navyMid: "#1A2E4A", navyLight: "#243854",
  blue: "#1D6FE8", blueMid: "#378ADD", blueLight: "#B5D4F4", bluePale: "#E6F1FB",
  teal: "#1D9E75", tealLight: "#9FE1CB", tealPale: "#E1F5EE",
  coral: "#D85A30", coralLight: "#F0997B", coralPale: "#FAECE7",
  amber: "#BA7517", amberPale: "#FAEEDA",
  gray50: "#F8F9FA", gray100: "#F1EFE8", gray200: "#D3D1C7",
  gray400: "#888780", gray600: "#5F5E5A",
  text: "#1A1A1A", textMid: "#444", textMuted: "#666", border: "#E2E0D8",
};
// 把 content.js 裡的顏色代號（如 "blue"、"tealPale"）換成實際色碼；若已是色碼則原樣回傳
const COL = (k) => (k in C ? C[k] : k);

// ─── Shared UI ──────────────────────────────────────────────────────────────
const Tag = ({ children, color = "blue" }) => {
  const colors = {
    blue: { bg: C.bluePale, text: "#185FA5" }, teal: { bg: C.tealPale, text: "#085041" },
    coral: { bg: C.coralPale, text: "#712B13" }, amber: { bg: C.amberPale, text: "#633806" },
    gray: { bg: C.gray100, text: C.gray600 },
  };
  const s = colors[color] || colors.blue;
  return (
    <span style={{ background: s.bg, color: s.text, fontSize: 11, fontWeight: 500, padding: "3px 10px", borderRadius: 20, letterSpacing: ".03em", whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
};

const SectionHeader = ({ label, title, sub }) => (
  <div style={{ marginBottom: 28 }}>
    <div style={{ fontSize: 11, fontWeight: 600, color: C.blue, letterSpacing: ".1em", textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
    <h2 style={{ fontSize: 22, fontWeight: 600, color: C.navy, lineHeight: 1.3, margin: 0, marginBottom: sub ? 8 : 0 }}>{title}</h2>
    {sub && <p style={{ fontSize: 14, color: C.textMuted, lineHeight: 1.6, margin: 0, maxWidth: 620 }}>{sub}</p>}
  </div>
);

const Card = ({ children, accent, style = {}, highlight }) => (
  <div style={{
    background: "#fff", border: `1px solid ${highlight ? C.blueMid : C.border}`,
    borderLeft: accent ? `4px solid ${accent}` : undefined,
    borderRadius: 12, padding: "20px 22px",
    boxShadow: highlight ? "0 0 0 2px " + C.bluePale : "none",
    ...style
  }}>
    {children}
  </div>
);

const StatCard = ({ num, unit, label, color = C.blue }) => (
  <div style={{ background: C.gray50, border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 18px", textAlign: "center" }}>
    <div style={{ fontSize: 26, fontWeight: 700, color, lineHeight: 1 }}>{num}<span style={{ fontSize: 14, fontWeight: 400, color: C.textMuted, marginLeft: 2 }}>{unit}</span></div>
    <div style={{ fontSize: 11, color: C.textMuted, marginTop: 4 }}>{label}</div>
  </div>
);

const Pill = ({ children, color = "blue" }) => {
  const map = { blue: [C.bluePale, "#185FA5"], teal: [C.tealPale, "#085041"], coral: [C.coralPale, "#712B13"], amber: [C.amberPale, "#633806"], gray: [C.gray100, C.gray600] };
  const [bg, fg] = map[color] || map.blue;
  return <span style={{ background: bg, color: fg, fontSize: 11, padding: "2px 9px", borderRadius: 20, display: "inline-block", margin: "2px 2px 0" }}>{children}</span>;
};

const Divider = () => <div style={{ height: 1, background: C.border, margin: "40px 0" }} />;

// ─── Nav ────────────────────────────────────────────────────────────────────
function Nav({ active, setActive }) {
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 10, background: "#fff", borderBottom: `1px solid ${C.border}`, overflowX: "auto" }}>
      <div style={{ display: "flex", gap: 0, padding: "0 4px", minWidth: "max-content" }}>
        {D.nav.map(s => (
          <button key={s.id} onClick={() => setActive(s.id)} style={{
            background: "none", border: "none", borderBottom: active === s.id ? `2px solid ${C.blue}` : "2px solid transparent",
            padding: "12px 14px", fontSize: 12.5, fontWeight: active === s.id ? 600 : 400,
            color: active === s.id ? C.navy : C.textMuted, cursor: "pointer", whiteSpace: "nowrap"
          }}>
            {s.label}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── Section: Overview ──────────────────────────────────────────────────────
function Overview() {
  const o = D.overview;
  return (
    <div>
      <div style={{ background: `linear-gradient(135deg, ${C.navy} 0%, ${C.navyMid} 60%, ${C.navyLight} 100%)`, borderRadius: 14, padding: "36px 36px 32px", marginBottom: 32, color: "#fff" }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
          <Tag color="blue">{o.hero.badge}</Tag>
          <span style={{ background: "rgba(255,255,255,.12)", color: "rgba(255,255,255,.85)", fontSize: 11, padding: "3px 10px", borderRadius: 20 }}>{o.hero.year}</span>
        </div>
        <h1 style={{ fontSize: 30, fontWeight: 700, lineHeight: 1.2, margin: "0 0 10px", letterSpacing: "-.01em" }}>
          {o.hero.titlePre}<span style={{ color: "#5BC4E8" }}>{o.hero.titleHighlight}</span>{o.hero.titlePost}
        </h1>
        <p style={{ fontSize: 15, color: "rgba(255,255,255,.75)", lineHeight: 1.65, maxWidth: 560, margin: "0 0 20px" }}>{o.hero.desc}</p>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          {o.hero.chips.map(t => (
            <span key={t} style={{ background: "rgba(255,255,255,.12)", color: "rgba(255,255,255,.85)", fontSize: 12, padding: "4px 12px", borderRadius: 20, border: "1px solid rgba(255,255,255,.2)" }}>{t}</span>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 32 }}>
        {o.stats.map(s => <StatCard key={s.label} num={s.num} unit={s.unit} label={s.label} color={COL(s.color)} />)}
      </div>

      <SectionHeader {...o.modules.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 32 }}>
        {o.modules.items.map(m => (
          <Card key={m.id} accent={COL(m.color)}>
            <div style={{ fontSize: 22, marginBottom: 10 }}>{m.icon}</div>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 2 }}>模組 {m.id}</div>
            <div style={{ fontSize: 16, fontWeight: 600, color: C.navy, marginBottom: 2 }}>{m.name}</div>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 10 }}>{m.eng}</div>
            <p style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.65, margin: "0 0 12px" }}>{m.desc}</p>
            <div>{m.tags.map(t => <Pill key={t} color={m.color}>{t}</Pill>)}</div>
          </Card>
        ))}
      </div>

      <SectionHeader {...o.positioning.header} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 32 }}>
        {o.positioning.cols.map(col => (
          <div key={col.label} style={{ background: col.ok ? C.tealPale : C.gray50, border: `1px solid ${col.ok ? C.tealLight : C.border}`, borderRadius: 12, padding: "18px 20px" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: col.ok ? "#0F6E56" : C.textMuted, marginBottom: 12 }}>{col.ok ? "✓ " : ""}{col.label}</div>
            {col.items.map(i => (
              <div key={i} style={{ fontSize: 13, color: col.ok ? "#085041" : C.textMuted, lineHeight: 1.7, display: "flex", gap: 8 }}>
                <span style={{ color: col.ok ? C.teal : C.gray400, flexShrink: 0 }}>{col.ok ? "◆" : "·"}</span>{i}
              </div>
            ))}
          </div>
        ))}
      </div>

      <SectionHeader {...o.customers.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
        {o.customers.items.map(c => (
          <Card key={c.name} style={{ padding: "16px 18px" }}>
            <div style={{ fontSize: 20, marginBottom: 8 }}>{c.icon}</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 3 }}>{c.name}</div>
            <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8 }}>{c.desc}</div>
            <div>{c.tags.map(t => <Pill key={t} color={c.color}>{t}</Pill>)}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ─── Section: Module A ──────────────────────────────────────────────────────
function ModuleA() {
  const a = D.moduleA;
  const [activeLayer, setActiveLayer] = useState(0);
  const layer = a.layers[activeLayer];
  return (
    <div>
      <SectionHeader {...a.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 28 }}>
        {a.stats.map(s => <StatCard key={s.label} num={s.num} unit={s.unit} label={s.label} color={COL(s.color)} />)}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {a.layers.map((l, i) => (
          <button key={i} onClick={() => setActiveLayer(i)} style={{
            background: activeLayer === i ? COL(l.color) : "transparent",
            color: activeLayer === i ? "#fff" : C.textMuted,
            border: `1px solid ${activeLayer === i ? COL(l.color) : C.border}`,
            borderRadius: 8, padding: "7px 16px", fontSize: 13, cursor: "pointer", fontWeight: activeLayer === i ? 600 : 400
          }}>{l.label}</button>
        ))}
      </div>

      <div style={{ background: C.gray50, borderRadius: 12, padding: "6px", border: `1px solid ${C.border}` }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {layer.items.map(item => (
            <div key={item.name} style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 18px" }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 6, display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: COL(layer.color), flexShrink: 0 }} />{item.name}
              </div>
              <div style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.7 }}>{item.detail}</div>
            </div>
          ))}
        </div>
      </div>

      <Divider />

      <SectionHeader {...a.hardware.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14 }}>
        {a.hardware.configs.map(cfg => (
          <Card key={cfg.tier} accent={COL(cfg.accent)} highlight={cfg.highlight}>
            {cfg.badge && <div style={{ background: COL(cfg.accent), color: "#fff", fontSize: 11, fontWeight: 600, padding: "3px 10px", borderRadius: 20, display: "inline-block", marginBottom: 10 }}>{cfg.badge}</div>}
            <div style={{ fontSize: 15, fontWeight: 700, color: C.navy, marginBottom: 2 }}>{cfg.tier}</div>
            <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 4 }}>適用：{cfg.forSize}</div>
            <div style={{ fontSize: 14, fontWeight: 600, color: COL(cfg.accent), marginBottom: 14 }}>{cfg.price}</div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 6 }}>硬體配置</div>
            {cfg.hw.map(h => <div key={h} style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.7 }}>· {h}</div>)}
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, margin: "10px 0 6px" }}>軟體 Stack</div>
            {cfg.sw.map(s => <div key={s} style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.7 }}>· {s}</div>)}
          </Card>
        ))}
      </div>

      <Divider />

      <SectionHeader {...a.usecases.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 }}>
        {a.usecases.items.map(uc => (
          <Card key={uc.name} style={{ padding: "16px 18px" }}>
            <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
              <span style={{ fontSize: 22, flexShrink: 0 }}>{uc.icon}</span>
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 4 }}>{uc.name}</div>
                <p style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.65, margin: "0 0 8px" }}>{uc.desc}</p>
                <Tag color="teal">{uc.benefit}</Tag>
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ─── Section: Module B ──────────────────────────────────────────────────────
function ModuleB() {
  const b = D.moduleB;
  const [step, setStep] = useState(0);
  return (
    <div>
      <SectionHeader {...b.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 28 }}>
        {b.stats.map(s => <StatCard key={s.label} num={s.num} unit={s.unit} label={s.label} color={COL(s.color)} />)}
      </div>

      <div style={{ background: C.gray50, border: `1px solid ${C.border}`, borderRadius: 12, padding: 20, marginBottom: 28 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.textMid, marginBottom: 14 }}>{b.pipelineTitle}</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
          {b.pipeline.map((p, i) => (
            <div key={i} onClick={() => setStep(i)} style={{
              background: step === i ? COL(p.color) : "#fff", color: step === i ? "#fff" : C.text,
              border: `1px solid ${step === i ? COL(p.color) : C.border}`, borderRadius: 8, padding: "10px 12px", cursor: "pointer", transition: "all .15s"
            }}>
              <div style={{ fontSize: 11, opacity: .7, marginBottom: 3 }}>{p.id}</div>
              <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.4 }}>{p.name}</div>
            </div>
          ))}
        </div>
        <div style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px 18px", marginTop: 14 }}>
          <div style={{ fontSize: 14, fontWeight: 600, color: COL(b.pipeline[step].color), marginBottom: 8 }}>{b.pipeline[step].id}｜{b.pipeline[step].name}</div>
          <div style={{ fontSize: 13.5, color: C.textMuted, lineHeight: 1.7 }}>{b.pipeline[step].detail}</div>
        </div>
      </div>

      <SectionHeader {...b.toolchain.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 14, marginBottom: 28 }}>
        {b.toolchain.cats.map(cat => (
          <Card key={cat.cat} accent={COL(cat.color)}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COL(cat.color), marginBottom: 12 }}>{cat.cat}</div>
            {cat.tools.map(t => (
              <div key={t.name} style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: C.navy }}>{t.name}</div>
                <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.5 }}>{t.role}</div>
              </div>
            ))}
          </Card>
        ))}
      </div>

      <SectionHeader {...b.ops.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
        {b.ops.steps.map(s => (
          <div key={s.step} style={{ background: "#fff", border: `1px solid ${C.border}`, borderRadius: 10, padding: "16px" }}>
            <div style={{ width: 28, height: 28, background: COL(s.color), borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{s.step}</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 6 }}>{s.title}</div>
            <div style={{ fontSize: 12, color: C.textMuted, lineHeight: 1.65 }}>{s.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Section: Module C ──────────────────────────────────────────────────────
function ModuleC() {
  const m = D.moduleC;
  const [activeTier, setActiveTier] = useState(1);
  const tier = m.tiers[activeTier];
  return (
    <div>
      <SectionHeader {...m.header} />
      <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
        {m.tiers.map((t, i) => (
          <button key={t.id} onClick={() => setActiveTier(i)} style={{
            background: activeTier === i ? COL(t.color) : "transparent", color: activeTier === i ? "#fff" : C.textMuted,
            border: `1px solid ${activeTier === i ? COL(t.color) : C.border}`, borderRadius: 8, padding: "8px 16px", fontSize: 13, cursor: "pointer", fontWeight: activeTier === i ? 600 : 400
          }}>{t.title}</button>
        ))}
      </div>

      <div style={{ background: COL(tier.bg), border: `2px solid ${COL(tier.color)}`, borderRadius: 14, padding: "22px 24px", marginBottom: 28 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, color: COL(tier.color) }}>{tier.title}</div>
            <div style={{ fontSize: 13, color: C.textMid }}>{tier.sub}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 16, fontWeight: 700, color: COL(tier.color) }}>{tier.rate}</div>
            <div style={{ fontSize: 12, color: C.textMuted }}>{tier.months}｜{tier.target}</div>
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 8 }}>{m.skillsLabel}</div>
            {tier.skills.map(s => <div key={s} style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.8, display: "flex", gap: 6 }}><span style={{ color: COL(tier.color) }}>◆</span>{s}</div>)}
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: C.textMid, marginBottom: 8 }}>{m.deliverablesLabel}</div>
            {tier.deliverables.map(d => <div key={d} style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.8, display: "flex", gap: 6 }}><span style={{ color: COL(tier.color) }}>✓</span>{d}</div>)}
          </div>
        </div>
      </div>

      <SectionHeader {...m.clauses.header} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {m.clauses.items.map(c => (
          <Card key={c.num} accent={COL(c.color)}>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ width: 28, height: 28, background: COL(c.color), borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 13, fontWeight: 700, flexShrink: 0, marginTop: 2 }}>{c.num}</div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 5 }}>{c.title}</div>
                <div style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.65 }}>{c.desc}</div>
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ─── Section: Architecture ───────────────────────────────────────────────────
function Architecture() {
  const ar = D.architecture;
  return (
    <div>
      <SectionHeader {...ar.header} />
      <div style={{ background: C.navy, borderRadius: 14, padding: "24px", marginBottom: 28, color: "#fff" }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "rgba(255,255,255,.5)", marginBottom: 16, letterSpacing: ".05em" }}>{ar.diagramTitle}</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 2 }}>
          {ar.archCols.map((col, i) => (
            <div key={i} style={{ background: "rgba(255,255,255,.06)", borderRadius: 10, padding: "14px 16px", border: "1px solid rgba(255,255,255,.1)" }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#5BC4E8", marginBottom: 10 }}>{col.title}</div>
              {col.items.map(item => (
                <div key={item} style={{ fontSize: 12, color: "rgba(255,255,255,.75)", lineHeight: 1.8, display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{ width: 4, height: 4, borderRadius: "50%", background: "rgba(255,255,255,.4)", flexShrink: 0 }} />{item}
                </div>
              ))}
            </div>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 2, marginTop: 2 }}>
          <div style={{ background: "rgba(29,158,117,.15)", border: "1px solid rgba(29,158,117,.4)", borderRadius: 10, padding: "12px 16px" }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#5BC4E8", marginBottom: 8 }}>{ar.fdeLayer.title}</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {ar.fdeLayer.items.map(i => <span key={i} style={{ background: "rgba(29,158,117,.2)", color: "#9FE1CB", fontSize: 11, padding: "3px 10px", borderRadius: 20 }}>{i}</span>)}
            </div>
          </div>
          <div style={{ background: "rgba(216,90,48,.1)", border: "1px solid rgba(216,90,48,.3)", borderRadius: 10, padding: "12px 16px" }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#F0997B", marginBottom: 8 }}>{ar.external.title}</div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>

// ─── Section: ROI ────────────────────────────────────────────────────────────
function ROI() {
  const R = D.roi, P = R.params;
  const [size, setSize] = useState(P.sizeDefault);
  const [plan, setPlan] = useState(P.defaultPlan);
  const [industry, setIndustry] = useState(P.defaultIndustry);

  const mul = P.industryMultipliers[industry] || 1;
  const pc = P.plans[plan], b = P.benefit;
  const totalCost = Math.round(pc.fde + pc.hw + pc.ops);

  const hrSave = Math.round(size * b.hrSalary * b.hrRate * mul * b.years / 10000);
  const qualityGain = Math.round(size * b.qualityBase * b.qualityRate * mul * b.years / 10000);
  const onboardSave = Math.round(size * b.onboardRatio * b.onboardCost * mul * b.years / 10000);
  const totalBenefit = hrSave + qualityGain + onboardSave;
  const roi = Math.round((totalBenefit - totalCost) / totalCost * 100);
  const payback = totalCost / (totalBenefit / (b.years * 12));

  const costRows = [
    { label: R.costBox.feeLabel, val: pc.fde, note: R.costBox.feeNote[plan] },
    { label: R.costBox.hwLabel,  val: pc.hw,  note: R.costBox.hwNote },
    { label: R.costBox.opsLabel, val: pc.ops, note: R.costBox.opsNote[plan] },
  ];
  const benefitVals = [hrSave, qualityGain, onboardSave];

  return (
    <div>
      <SectionHeader {...R.header} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 14, marginBottom: 24 }}>
        <Card>
          <label style={{ fontSize: 12, color: C.textMuted, display: "block", marginBottom: 6 }}>{R.controls.sizeLabel}</label>
          <input type="range" min={P.sizeMin} max={P.sizeMax} step={P.sizeStep} value={size} onChange={e => setSize(+e.target.value)} style={{ width: "100%", marginBottom: 4 }} />
          <div style={{ fontSize: 18, fontWeight: 700, color: C.blue }}>{size} {R.controls.sizeUnit}</div>
        </Card>
        <Card>
          <label style={{ fontSize: 12, color: C.textMuted, display: "block", marginBottom: 8 }}>{R.controls.planLabel}</label>
          {R.controls.planOptions.map(opt => (
            <label key={opt.value} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, cursor: "pointer" }}>
              <input type="radio" name="plan" value={opt.value} checked={plan === opt.value} onChange={() => setPlan(opt.value)} />
              <span style={{ fontSize: 13, color: plan === opt.value ? C.blue : C.textMuted, fontWeight: plan === opt.value ? 600 : 400 }}>{opt.label}</span>
            </label>
          ))}
        </Card>
        <Card>
          <label style={{ fontSize: 12, color: C.textMuted, display: "block", marginBottom: 8 }}>{R.controls.industryLabel}</label>
          <select value={industry} onChange={e => setIndustry(e.target.value)} style={{ width: "100%", fontSize: 13 }}>
            {R.controls.industryOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
          </select>
        </Card>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 24 }}>
        <div style={{ background: C.coralPale, border: `1px solid ${C.coral}44`, borderRadius: 10, padding: "16px", textAlign: "center" }}>
          <div style={{ fontSize: 11, color: C.coral, fontWeight: 600, marginBottom: 4 }}>{R.resultLabels.cost}</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#712B13" }}>NT${totalCost}萬</div>
        </div>
        <div style={{ background: C.tealPale, border: `1px solid ${C.teal}44`, borderRadius: 10, padding: "16px", textAlign: "center" }}>
          <div style={{ fontSize: 11, color: C.teal, fontWeight: 600, marginBottom: 4 }}>{R.resultLabels.benefit}</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#085041" }}>NT${totalBenefit}萬</div>
        </div>
        <div style={{ background: roi > 0 ? C.tealPale : C.coralPale, border: `1px solid ${roi > 0 ? C.teal : C.coral}44`, borderRadius: 10, padding: "16px", textAlign: "center" }}>
          <div style={{ fontSize: 11, color: roi > 0 ? C.teal : C.coral, fontWeight: 600, marginBottom: 4 }}>{R.resultLabels.roi}</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: roi > 0 ? "#085041" : "#712B13" }}>{roi > 0 ? "+" : ""}{roi}%</div>
        </div>
        <div style={{ background: C.bluePale, border: `1px solid ${C.blue}44`, borderRadius: 10, padding: "16px", textAlign: "center" }}>
          <div style={{ fontSize: 11, color: C.blue, fontWeight: 600, marginBottom: 4 }}>{R.resultLabels.payback}</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#185FA5" }}>{Math.round(payback)}{R.resultLabels.paybackUnit}</div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 24 }}>
        <Card accent={C.coral}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 14 }}>{R.costBox.title}</div>
          {costRows.map(i => (
            <div key={i.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${C.border}`, padding: "8px 0" }}>
              <div><div style={{ fontSize: 13 }}>{i.label}</div><div style={{ fontSize: 11, color: C.textMuted }}>{i.note}</div></div>
              <div style={{ fontSize: 14, fontWeight: 600, color: C.coral }}>NT${i.val}萬</div>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 0" }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{R.costBox.totalLabel}</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.coral }}>NT${totalCost}萬</div>
          </div>
        </Card>
        <Card accent={C.teal}>
          <div style={{ fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 14 }}>{R.benefitBox.title}</div>
          {R.benefitBox.rows.map((i, idx) => (
            <div key={i.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${C.border}`, padding: "8px 0" }}>
              <div><div style={{ fontSize: 13 }}>{i.label}</div><div style={{ fontSize: 11, color: C.textMuted }}>{i.note}</div></div>
              <div style={{ fontSize: 14, fontWeight: 600, color: C.teal }}>NT${benefitVals[idx]}萬</div>
            </div>
          ))}
          <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0 0" }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{R.benefitBox.totalLabel}</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.teal }}>NT${totalBenefit}萬</div>
          </div>
        </Card>
      </div>

      <div style={{ background: C.amberPale, border: `1px solid ${C.amber}44`, borderRadius: 12, padding: "16px 20px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.amber, marginBottom: 6 }}>{R.disclaimer.title}</div>
        <div style={{ fontSize: 12.5, color: C.textMuted, lineHeight: 1.7 }}>{R.disclaimer.body}</div>
      </div>
    </div>
  );
}

// ─── Section: Decision ───────────────────────────────────────────────────────
function Decision() {
  const dc = D.decision;
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);
  const questions = dc.questions;
  const answered = Object.keys(answers).length;
  const progress = Math.round(answered / questions.length * 100);

  function calcResult() {
    const a = answers;
    let rec = "growth";
    if (a.size === "lt50" || a.budget === "lt200") rec = "starter";
    else if (a.size === "gt300" || a.budget === "gt800") rec = "enterprise";

    let deploy = "hybrid";
    if (a.regulated === "yes" || a.dataLocal === "must") deploy = "onprem";
    else if (a.dataLocal === "no" && a.itCap === "none") deploy = "cloud";

    let fde = "senior";
    if (a.itCap === "strong" && a.priority === "speed") fde = "associate";
    else if (a.regulated === "yes" || a.size === "gt300") fde = "principal";

    setResult({ rec, deploy, fde });
  }

  return (
    <div>
      <SectionHeader {...dc.header} />
      <div style={{ background: C.gray50, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 16px", marginBottom: 24, display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{ flex: 1, height: 6, background: C.gray200, borderRadius: 3 }}>
          <div style={{ height: "100%", width: `${progress}%`, background: C.blue, borderRadius: 3, transition: "width .3s" }} />
        </div>
        <div style={{ fontSize: 13, color: C.textMuted, whiteSpace: "nowrap" }}>{answered} / {questions.length} {dc.answeredLabel}</div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 24 }}>
        {questions.map(q => (
          <Card key={q.id}>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 10 }}>{q.q}</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {q.opts.map(([val, label]) => (
                <button key={val} onClick={() => setAnswers(prev => ({ ...prev, [q.id]: val }))} style={{
                  background: answers[q.id] === val ? C.blue : "transparent", color: answers[q.id] === val ? "#fff" : C.textMuted,
                  border: `1px solid ${answers[q.id] === val ? C.blue : C.border}`, borderRadius: 8, padding: "6px 12px", fontSize: 12.5, cursor: "pointer", fontWeight: answers[q.id] === val ? 600 : 400
                }}>{label}</button>
              ))}
            </div>
          </Card>
        ))}
      </div>

      <div style={{ textAlign: "center", marginBottom: 24 }}>
        <button onClick={calcResult} disabled={answered < questions.length} style={{
          background: answered === questions.length ? C.navy : C.gray200, color: answered === questions.length ? "#fff" : C.gray400,
          border: "none", borderRadius: 10, padding: "12px 32px", fontSize: 15, fontWeight: 600, cursor: answered === questions.length ? "pointer" : "default"
        }}>
          {answered < questions.length ? dc.btnIncomplete.replace("{n}", questions.length - answered) : dc.btnComplete}
        </button>
      </div>

      {result && (
        <div style={{ background: C.navy, borderRadius: 14, padding: "24px", color: "#fff" }}>
          <div style={{ fontSize: 13, color: "rgba(255,255,255,.5)", marginBottom: 16 }}>{dc.resultIntro}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
            {[
              { label: dc.cards.plan, detail: dc.planDetails[result.rec], icon: "📦" },
              { label: dc.cards.deploy, detail: dc.deployDetails[result.deploy], icon: "🏗️" },
              { label: dc.cards.fde, detail: dc.fdeDetails[result.fde], icon: "👤" },
            ].map(item => (
              <div key={item.label} style={{ background: "rgba(255,255,255,.08)", border: "1px solid rgba(255,255,255,.1)", borderRadius: 12, padding: "18px" }}>
                <div style={{ fontSize: 20, marginBottom: 8 }}>{item.icon}</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,.4)", marginBottom: 4 }}>{dc.recLabel}</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: "#5BC4E8", marginBottom: 6 }}>{item.detail.label}</div>
                {item.detail.price && <div style={{ fontSize: 12, color: "rgba(255,255,255,.6)", marginBottom: 6 }}>{item.detail.price}</div>}
                <div style={{ fontSize: 12, color: "rgba(255,255,255,.6)", lineHeight: 1.6 }}>{item.detail.desc}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 16, padding: "14px 18px", background: "rgba(93,202,165,.12)", border: "1px solid rgba(29,158,117,.3)", borderRadius: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#9FE1CB", marginBottom: 6 }}>{dc.firstStep.title}</div>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,.7)", lineHeight: 1.6 }}>
              {dc.firstStep.bodyPre}<strong style={{ color: "#5BC4E8" }}>{dc.firstStep.sprint}</strong>{dc.firstStep.bodyPost}
            </div>
          </div>
          <button onClick={() => { setAnswers({}); setResult(null); }} style={{ background: "transparent", border: "1px solid rgba(255,255,255,.2)", color: "rgba(255,255,255,.6)", borderRadius: 8, padding: "8px 20px", fontSize: 13, cursor: "pointer", marginTop: 14 }}>{dc.resetLabel}</button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [active, setActive] = useState("overview");
  const PANELS = { overview: Overview, moduleA: ModuleA, moduleB: ModuleB, moduleC: ModuleC, architecture: Architecture, roadmap: Roadmap, compliance: Compliance, pricing: Pricing, roi: ROI, decision: Decision };
  const Panel = PANELS[active] || Overview;
  return (
    <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", maxWidth: 900, margin: "0 auto", background: "#fff" }}>
      <Nav active={active} setActive={setActive} />
      <div style={{ padding: "28px 24px 48px" }}>
        <Panel />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
